<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildBase - Animal Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .category-tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .category-tab.active {
            background: white;
            color: #667eea;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-tab {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .view-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            color: white;
            transition: all 0.3s;
        }

        .view-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .view-btn.active {
            background: white;
            color: #667eea;
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Card View */
        .animal-grid.card-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .animal-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .animal-card:hover {
            transform: translateY(-5px);
        }

        .animal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .animal-image-fallback {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 4rem;
        }

        .animal-image-fallback.cats {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .animal-image-fallback.dogs {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .animal-image-fallback.birds {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .animal-image-fallback.rabbits {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .animal-image-fallback.hedgehogs {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
        }

        .animal-info {
            padding: 20px;
        }

        .animal-name {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
        }

        .animal-category {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .animal-origin {
            color: #666;
            margin-bottom: 10px;
        }

        .animal-temperament {
            color: #888;
            font-style: italic;
            margin-bottom: 15px;
        }

        .animal-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #667eea;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
        }

        /* List View */
        .animal-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .animal-grid.list-view .animal-card {
            display: flex;
            flex-direction: row;
        }

        .animal-grid.list-view .animal-image {
            width: 150px;
            height: 150px;
            flex-shrink: 0;
        }

        .animal-grid.list-view .animal-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .animal-grid.list-view .animal-details {
            display: flex;
            gap: 20px;
        }

        /* Compact View */
        .animal-grid.compact-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .animal-grid.compact-view .animal-card {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .animal-grid.compact-view .animal-image {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .animal-grid.compact-view .animal-info {
            padding: 10px;
        }

        .animal-grid.compact-view .animal-name {
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .animal-grid.compact-view .animal-details {
            display: none;
        }

        .no-results {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 18px;
        }

        /* My Friends Section */
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .form-container h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #eee;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        /* My Friends Cards */
        .my-animal-grid.card-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .my-animal-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .my-animal-photo {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            background: #f0f0f0;
        }

        .my-animal-photo-fallback {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 3rem;
        }

        .my-animal-header {
            padding: 20px 20px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .my-animal-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .my-animal-species {
            opacity: 0.9;
        }

        .my-animal-body {
            padding: 15px 20px;
        }

        .my-animal-detail {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .my-animal-detail:last-child {
            border-bottom: none;
        }

        .my-animal-label {
            font-weight: 600;
            color: #667eea;
            min-width: 100px;
            flex-shrink: 0;
        }

        .my-animal-value {
            color: #333;
            flex: 1;
            text-align: right;
        }

        .my-animal-actions {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: #f8f9fa;
            justify-content: center;
        }

        .action-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .action-btn-edit {
            background: #667eea;
            color: white;
        }

        .action-btn-edit:hover {
            background: #5a6fd6;
        }

        .action-btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .action-btn-delete:hover {
            background: #ee5a5a;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #333;
            background: none;
            border: none;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 2rem;
            color: #333;
        }

        .modal-category {
            display: inline-block;
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .modal-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .modal-detail {
            display: flex;
            flex-direction: column;
        }

        .modal-detail-label {
            color: #667eea;
            font-weight: 600;
            font-size: 13px;
        }

        .modal-detail-value {
            color: #333;
        }

        .modal-wikipedia {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
        }

        .modal-wikipedia:hover {
            background: #5a6fd6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-details-grid {
                grid-template-columns: 1fr;
            }

            .animal-grid.list-view .animal-card {
                flex-direction: column;
            }

            .animal-grid.list-view .animal-image {
                width: 100%;
                height: 150px;
            }

            .animal-grid.list-view .animal-info {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐾 WildBase</h1>
            <p>Your comprehensive animal database</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('database')">📚 Animal Database</button>
            <button class="nav-tab" onclick="showSection('myfriends')">❤️ My Friends</button>
        </div>

        <!-- Database Section -->
        <div id="database-section" class="section active">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search animals by name, breed, or origin..." oninput="filterAnimals()">
            </div>

            <div class="category-tabs">
                <button class="category-tab active" onclick="filterByCategory('All')">All</button>
                <button class="category-tab" onclick="filterByCategory('Cats')">🐱 Cats</button>
                <button class="category-tab" onclick="filterByCategory('Dogs')">🐕 Dogs</button>
                <button class="category-tab" onclick="filterByCategory('Birds')">🐦 Birds</button>
                <button class="category-tab" onclick="filterByCategory('Rabbits')">🐰 Rabbits</button>
                <button class="category-tab" onclick="filterByCategory('Hedgehogs')">🦔 Hedgehogs</button>
            </div>

            <div class="view-toggle">
                <button class="view-btn active" data-view="card" onclick="setView('database', 'card')">📋 Card</button>
                <button class="view-btn" data-view="list" onclick="setView('database', 'list')">📄 List</button>
                <button class="view-btn" data-view="compact" onclick="setView('database', 'compact')">📊 Compact</button>
            </div>

            <div class="stats" id="stats">Loading animals...</div>

            <div class="animal-grid card-view" id="animalGrid"></div>
            <div class="no-results" id="noResults" style="display: none;">No animals found matching your search.</div>
        </div>

        <!-- My Friends Section -->
        <div id="myfriends-section" class="section">
            <button class="btn btn-primary" id="toggleFormBtn" onclick="toggleForm()" style="margin-bottom: 20px;">+ Add New Animal</button>
            <div class="form-container" id="animalFormContainer">
                <h2 id="formTitle">Add New Animal</h2>
                <form id="animalForm">
                    <input type="hidden" id="animalId">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="animalName">Name *</label>
                            <input type="text" id="animalName" required>
                        </div>
                        <div class="form-group">
                            <label for="animalSpecies">Species/Breed</label>
                            <input type="text" id="animalSpecies" placeholder="e.g., Persian, Golden Retriever">
                        </div>
                        <div class="form-group">
                            <label for="animalAge">Age</label>
                            <input type="text" id="animalAge" placeholder="e.g., 3 years">
                        </div>
                        <div class="form-group">
                            <label for="animalGender">Gender</label>
                            <select id="animalGender">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Unknown">Unknown</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="animalColor">Color</label>
                            <input type="text" id="animalColor" placeholder="e.g., Tortoiseshell">
                        </div>
                        <div class="form-group">
                            <label for="animalWeight">Weight</label>
                            <input type="text" id="animalWeight" placeholder="e.g., 4.5 kg">
                        </div>
                        <div class="form-group">
                            <label for="animalAddress">Location</label>
                            <input type="text" id="animalAddress" placeholder="e.g., Riedberg">
                        </div>
                        <div class="form-group">
                            <label for="animalVaccination">Vaccination Status</label>
                            <select id="animalVaccination">
                                <option value="">Select</option>
                                <option value="Up to date">Up to date</option>
                                <option value="Needs update">Needs update</option>
                                <option value="Unknown">Unknown</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="animalPersonality">Personality</label>
                            <input type="text" id="animalPersonality" placeholder="e.g., Affectionate, playful">
                        </div>
                        <div class="form-group">
                            <label for="animalFood">Favorite Food</label>
                            <input type="text" id="animalFood" placeholder="e.g., Wet food, chicken">
                        </div>
                        <div class="form-group">
                            <label for="animalHealth">Health Notes</label>
                            <input type="text" id="animalHealth" placeholder="e.g., Healthy, no issues">
                        </div>
                        <div class="form-group">
                            <label for="animalPhoto">Photo URL or Local Path</label>
                            <input type="text" id="animalPhoto" placeholder="https://... or assets/cats/photo.jpg">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="animalNotes">Notes</label>
                        <textarea id="animalNotes" placeholder="Any additional notes about this animal..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Animal</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="view-toggle">
                <button class="view-btn active" data-view="card" onclick="setView('myfriends', 'card')">📋 Card</button>
                <button class="view-btn" data-view="list" onclick="setView('myfriends', 'list')">📄 List</button>
                <button class="view-btn" data-view="compact" onclick="setView('myfriends', 'compact')">📊 Compact</button>
            </div>

            <div class="stats" id="myAnimalsStats">Loading your animals...</div>

            <div class="my-animal-grid card-view" id="myAnimalsGrid"></div>
            <div class="no-results" id="noMyAnimals" style="display: none;">No animals added yet. Use the form above to add your first animal!</div>
        </div>
    </div>

    <div class="modal" id="animalModal">
        <div class="modal-content">
            <button class="close-button" onclick="closeModal()">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayAnimals(animalsData);

        // Get emoji for animal category
        function getCategoryEmoji(category) {
            const emojis = {
                'Cats': '🐱',
                'Dogs': '🐕',
                'Birds': '🐦',
                'Rabbits': '🐰',
                'Hedgehogs': '🦔'
            };
            return emojis[category] || '🐾';
        }

        // Get CSS class for category
        function getCategoryClass(category) {
            return category.toLowerCase().replace(/[^a-z]/g, '');
        }

        // Handle image error with emoji fallback
        function handleImageError(img, animal) {
            const fallback = document.createElement('div');
            fallback.className = `animal-image-fallback ${getCategoryClass(animal.category)}`;
            fallback.innerHTML = getCategoryEmoji(animal.category);
            img.parentNode.replaceChild(fallback, img);
        }

        // Display animals in database
        function displayAnimals(animals) {
            const grid = document.getElementById('animalGrid');
            const noResults = document.getElementById('noResults');
            const stats = document.getElementById('stats');
            
            if (animals.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                stats.textContent = 'No animals found';
                return;
            }
            
            noResults.style.display = 'none';
            stats.textContent = `Showing ${animals.length} animal(s)`;
            
            grid.innerHTML = animals.map(animal => `
                <div class="animal-card" onclick="openModal(${animal.id})">
                    <img src="${animal.image_url}" alt="${animal.name}" class="animal-image" onerror="handleImageError(this, ${JSON.stringify(animal).replace(/"/g, '&quot;')})">
                    <div class="animal-info">
                        <div class="animal-name">${animal.name}</div>
                        <span class="animal-category">${animal.category}</span>
                        <div class="animal-origin">📍 ${animal.origin}</div>
                        <div class="animal-temperament">${animal.temperament}</div>
                        <div class="animal-details">
                            <div class="detail-item">
                                <span class="detail-label">Size</span>
                                <span class="detail-value">${animal.size}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Lifespan</span>
                                <span class="detail-value">${animal.lifespan}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Care Level</span>
                                <span class="detail-value">${animal.care_level}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Price Range</span>
                                <span class="detail-value">${animal.price_range}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter animals
        function filterAnimals() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filtered = animalsData;
            
            if (searchTerm) {
                filtered = filtered.filter(animal => 
                    animal.name.toLowerCase().includes(searchTerm) ||
                    animal.origin.toLowerCase().includes(searchTerm) ||
                    animal.temperament.toLowerCase().includes(searchTerm) ||
                    animal.category.toLowerCase().includes(searchTerm)
                );
            }
            
            if (currentCategory !== 'All') {
                filtered = filtered.filter(animal => animal.category === currentCategory);
            }
            
            displayAnimals(filtered);
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent.includes(category) || (category === 'All' && tab.textContent.includes('All'))) {
                    tab.classList.add('active');
                }
            });
            
            filterAnimals();
        }

        // Set view mode
        function setView(section, view) {
            currentView[section] = view;
            
            const gridId = section === 'database' ? 'animalGrid' : 'myAnimalsGrid';
            const grid = document.getElementById(gridId);
            
            grid.classList.remove('card-view', 'list-view', 'compact-view');
            grid.classList.add(`${view}-view`);
            
            const container = section === 'database' ? 
                document.querySelectorAll('#database-section .view-btn') :
                document.querySelectorAll('#myfriends-section .view-btn');
            
            container.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.view === view) {
                    btn.classList.add('active');
                }
            });
        }

        // Open modal
        function openModal(id) {
            const animal = animalsData.find(a => a.id === id);
            if (!animal) return;
            
            const modal = document.getElementById('animalModal');
            const body = document.getElementById('modalBody');
            
            body.innerHTML = `
                <img src="${animal.image_url}" alt="${animal.name}" class="modal-image">
                <div class="modal-header">
                    <div>

                        <div class="animal-origin" style="margin-top: 5px;">📍 ${animal.origin}</div>

                        <div class="modal-detail">

                            <span class="modal-detail-value">${animal.conservation_status}</span>
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('animalModal').classList.remove('active');
        }

        // Show section
        function showSection(section) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${section}-section`).classList.add('active');
        }

        // Toggle form
        function toggleForm() {
            const form = document.getElementById('animalFormContainer');
            const btn = document.getElementById('toggleFormBtn');
            if (form.style.display === 'none' || !form.style.display) {
                form.style.display = 'block';
                btn.textContent = '- Hide Form';
                form.scrollIntoView({ behavior: 'smooth' });
            } else {
                form.style.display = 'none';
                btn.textContent = '+ Add New Animal';
                resetForm();
            }
        }

        // Load my animals from localStorage
        function loadMyAnimals() {
            const saved = localStorage.getItem('myAnimals');
            if (saved) {
                myAnimals = JSON.parse(saved);
                const nala = myAnimals.find(a => a.name === 'Nala');
                if (nala && !nala.photo_url) {
                    nala.photo_url = 'my-friends/photos/01_Nala.JPG';

                    lizzy.photo_url = 'my-friends/photos/02_Lizzy.jpg';

        // Save my animals to localStorage
        function saveMyAnimals() {
            localStorage.setItem('myAnimals', JSON.stringify(myAnimals));
        }

        // Display my animals
        function displayMyAnimals() {
            const grid = document.getElementById('myAnimalsGrid');
            const noAnimals = document.getElementById('noMyAnimals');
            const stats = document.getElementById('myAnimalsStats');
            
            if (myAnimals.length === 0) {
                grid.innerHTML = '';
                noAnimals.style.display = 'block';
                stats.textContent = 'No animals added yet';
                return;
            }
            
            noAnimals.style.display = 'none';
            stats.textContent = `You have ${myAnimals.length} animal(s) in your collection`;
            
            grid.innerHTML = myAnimals.map(animal => `
                <div class="my-animal-card">
                    ${animal.photo_url ? `<img src="${animal.photo_url}" alt="${animal.name}" class="my-animal-photo" onerror="this.style.display='none'">` : `<div class="animal-image-fallback" style="height: 150px; font-size: 3rem;">🐾</div>`}
                    <div class="my-animal-header">
                        <div class="my-animal-name">${animal.name}</div>
                        <div class="my-animal-species">${animal.species || 'Unknown species'}</div>
                    </div>
                    <div class="my-animal-body">
                        <div class="my-animal-detail">
                            <span class="my-animal-label">Age</span>
                            <span class="my-animal-value">${animal.age || 'Not specified'}</span>

                        <div class="my-animal-detail">

                            <span class="my-animal-value">${animal.address || 'Not specified'}</span>

                        <div class="my-animal-detail">
                            <span class="my-animal-label">Vaccination</span>
                            <span class="my-animal-value">${animal.vaccination_status || 'Not specified'}</span>

                        <div class="my-animal-detail">
                            <span class="my-animal-label">Health</span>
                            <span class="my-animal-value">${animal.health_notes || 'Not specified'}</span>

                            <span class="my-animal-value">${animal.personality || 'Not specified'}</span>

                            <span class="my-animal-label">Favorite Food</span>
                            <span class="my-animal-value">${animal.favorite_food || 'Not specified'}</span>

                        <button class="action-btn action-btn-edit" onclick="editMyAnimal(${animal.id})">Edit</button>

        // Form submit
        document.getElementById('animalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const animal = {
                id: editingAnimalId || Date.now(),
                name: document.getElementById('animalName').value,
                species: document.getElementById('animalSpecies').value,
                age: document.getElementById('animalAge').value,
                gender: document.getElementById('animalGender').value,
                color: document.getElementById('animalColor').value,
                weight: document.getElementById('animalWeight').value,
                address: document.getElementById('animalAddress').value,
                vaccination_status: document.getElementById('animalVaccination').value,
                personality: document.getElementById('animalPersonality').value,
                favorite_food: document.getElementById('animalFood').value,
                health_notes: document.getElementById('animalHealth').value,
                photo_url: document.getElementById('animalPhoto').value,
                notes: document.getElementById('animalNotes').value
            };
            
            if (editingAnimalId) {
                const index = myAnimals.findIndex(a => a.id === editingAnimalId);
                if (index !== -1) {
                    myAnimals[index] = animal;
                }
            } else {
                myAnimals.push(animal);
            }
            
            saveMyAnimals();
            displayMyAnimals();
            resetForm();
            toggleForm();
        });

        // Edit my animal
        function editMyAnimal(id) {
            const animal = myAnimals.find(a => a.id === id);
            if (!animal) return;
            
            editingAnimalId = id;
            document.getElementById('formTitle').textContent = 'Edit Animal';
            document.getElementById('animalName').value = animal.name || '';
            document.getElementById('animalSpecies').value = animal.species || '';
            document.getElementById('animalAge').value = animal.age || '';
            document.getElementById('animalGender').value = animal.gender || '';
            document.getElementById('animalColor').value = animal.color || '';
            document.getElementById('animalWeight').value = animal.weight || '';
            document.getElementById('animalAddress').value = animal.address || '';
            document.getElementById('animalVaccination').value = animal.vaccination_status || '';
            document.getElementById('animalHealth').value = animal.health_notes || '';
            document.getElementById('animalPersonality').value = animal.personality || '';
            document.getElementById('animalFood').value = animal.favorite_food || '';
            document.getElementById('animalPhoto').value = animal.photo_url || '';
            document.getElementById('animalNotes').value = animal.notes || '';
            
            document.getElementById('animalFormContainer').style.display = 'block';
            document.getElementById('toggleFormBtn').textContent = '- Hide Form';
            document.querySelector('.form-container').scrollIntoView({ behavior: 'smooth' });
        }

        // Delete my animal
        function deleteMyAnimal(id) {
            if (confirm('Are you sure you want to delete this animal?')) {
                myAnimals = myAnimals.filter(a => a.id !== id);
                saveMyAnimals();
                displayMyAnimals();
            }
        }

        // Reset form
        function resetForm() {
            editingAnimalId = null;
            document.getElementById('formTitle').textContent = 'Add New Animal';
            document.getElementById('animalForm').reset();
        }

        // Close modal on outside click
        document.getElementById('animalModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
